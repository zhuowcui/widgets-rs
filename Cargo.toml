[workspace]
members = ["crates/widget_api", "crates/clock_core", "crates/provider", "crates/settings"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
windows-core = "=0.100.0"
windows-collections = "=0.100.0"
windows-time = "=0.100.0"
windows-reference = "=0.100.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

